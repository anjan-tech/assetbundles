# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 49df35c1-10a9-4f07-9c34-f3a96c72f75f

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-908801cf-3852.cloud.databricks.com/
    variables:
      catalog: assetbundles
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-908801cf-3852.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/anjanmurthy07737@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anjanmurthy07737@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
